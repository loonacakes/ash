<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История заказов — LOONA CAKES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #FDFBF7;
      --primary: #5A3A22;
      --accent: #E1306C;
      --border-color: #E6D8C8;
      --shadow-lg: 0 20px 40px rgba(90, 58, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #F5EBE0 0%, var(--bg-main) 65%);
      color: var(--primary);
    }

    header {
      padding: 22px 25px;
      border-bottom: 1px solid rgba(230, 216, 200, 0.7);
      background: rgba(253, 251, 247, 0.9);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--primary);
      font: 800 2rem 'Cormorant Garamond', serif;
      letter-spacing: 3px;
      text-decoration: none;
    }

    .back-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 55px 25px 80px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font: 700 4rem/1 'Cormorant Garamond', serif;
    }

    .intro {
      margin: 0 auto 32px;
      color: #806F63;
      font-size: 1.05rem;
    }

    .instagram-feed {
      width: 100%;
      height: 720px;
      display: block;
      margin: 0 auto 28px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow-lg);
    }

    .instagram-link {
      display: inline-block;
      padding: 17px 32px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 3rem;
      }

      .instagram-feed {
        height: 650px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <a class="logo" href="index.html">LOONA CAKES</a>
      <a class="back-link" href="index.html">← Вернуться на главную</a>
    </div>
  </header>

  <main>
    <h1>История заказов</h1>
    <p class="intro">Все новые работы и фотографии смотрите в нашем Instagram</p>
    <iframe
      class="instagram-feed"
      src="https://www.instagram.com/loona_cakes_lsk/embed"
      title="Фотографии заказов LOONA CAKES в Instagram"
      loading="lazy">
    </iframe>
    <a class="instagram-link" href="https://www.instagram.com/loona_cakes_lsk/" target="_blank" rel="noopener noreferrer">📸 Открыть все фото в Instagram</a>
  </main>
</body>
</html>
